services:
  - type: web
    name: ph-job-agent
    runtime: python
    buildCommand: pip install -r requirements.txt && playwright install --with-deps chromium
    startCommand: uvicorn src.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: POLLING_ENABLED
        value: "false"
      - key: WORKER_REQUIRED
        value: "true"
      - key: APP_TIMEZONE
        value: Asia/Manila
  - type: worker
    name: ph-job-agent-worker
    runtime: python
    plan: 0.5c-512mb
    buildCommand: pip install -r requirements.txt && playwright install --with-deps chromium
    startCommand: python -m src.worker
    envVars:
      - key: POLLING_ENABLED
        value: "true"
      - key: WORKER_REQUIRED
        value: "true"
      - key: APP_TIMEZONE
        value: Asia/Manila
